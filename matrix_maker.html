<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Image Maker - Rehan</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            text-shadow: 0 0 10px #00ff00;
        }

        .container {
            max-width: 90%;
            margin: auto;
        }

        .controls {
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 10px;
            background-color: #1a1a1a;
        }

        input[type="file"] {
            color: white;
            padding: 10px;
        }

        button {
            background-color: #00ff00;
            color: black;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }

        button:hover {
            background-color: white;
            box-shadow: 0 0 15px #00ff00;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border: 2px solid #333;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        #downloadBtn {
            display: none; /* Pehle chhupa rahega jab tak image na ban jaye */
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Binary Matrix Effect</h1>
        <p>Apni photo select karo, code ka magic dekho!</p>

        <div class="controls">
            <input type="file" id="uploadInput" accept="image/*">
            <br>
            <p id="statusText" style="color: yellow; font-size: 14px;"></p>
        </div>

        <canvas id="matrixCanvas"></canvas>
        <br>
        <button id="downloadBtn">Download Image</button>
    </div>

    <script>
        const uploadInput = document.getElementById('uploadInput');
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusText = document.getElementById('statusText');

        // Jab user photo select kare
        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusText.innerText = "Processing... Please wait.";

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    createBinaryEffect(img);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function createBinaryEffect(img) {
            // Step 1: Canvas ka size set karo
            // Hum thoda high quality rakhenge taaki text clear dikhe
            const scale = 1; 
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;

            // Pehle original image draw karo taaki hum colors le sakein
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // Image ka sara data (colors) copy kar lo
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // Ab canvas ko pura BLACK kar do (background ke liye)
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Step 2: Binary Text Settings
            const fontSize = 12; // Text ka size (agar detail kam lage to ise 8 ya 10 kar dena)
            ctx.font = "bold " + fontSize + "px monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // Step 3: Loop chalao aur har thodi doori par 0 ya 1 likho
            for (let y = 0; y < canvas.height; y += fontSize) {
                for (let x = 0; x < canvas.width; x += fontSize * 0.6) { // 0.6 isliye taaki text paas paas ho
                    
                    // Pixel ka position nikalo
                    const index = (Math.floor(y) * canvas.width + Math.floor(x)) * 4;
                    
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    const alpha = data[index + 3];

                    // Agar pixel transparent nahi hai to hi draw karo
                    if (alpha > 128) {
                        // Color wahi rakho jo original photo mein tha
                        ctx.fillStyle = `rgb(${r},${g},${b})`;
                        
                        // Randomly 0 ya 1 select karo
                        const binaryChar = Math.random() > 0.5 ? "1" : "0";
                        
                        // Text draw karo
                        ctx.fillText(binaryChar, x, y);
                    }
                }
            }

            statusText.innerText = "Done! Ab Download kar lo.";
            downloadBtn.style.display = "inline-block";
        }

        // Download Button ka kaam
        downloadBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'rehan-matrix-style.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

    </script>
</body>
  </html>
